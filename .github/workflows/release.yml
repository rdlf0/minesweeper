name: Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version type to increment"
        required: true
        default: minor
        type: choice
        options:
          - patch
          - minor
          - major

env:
  ARTIFACT_NAME: minesweeper-compiled

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      ARTIFACT_PATH: artifact
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install TypeScript
        run: npm install -g typescript@6.0.3   # keep in sync with the PR validation workflow

      - name: Compile the source
        run: tsc --outDir "${ARTIFACT_PATH}/dist"

      - name: Prepare artifact
        run: |
          rsync -a \
            --exclude="/.git" \
            --exclude="/.github" \
            --exclude="/.vscode" \
            --exclude="/src" \
            --exclude="/test" \
            --exclude="/node_modules" \
            --exclude="/tsconfig.json" \
            --exclude="/.gitignore" \
            --exclude="*.md" \
            --exclude="/${ARTIFACT_PATH}" \
            ./ "${ARTIFACT_PATH}/"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ./${{ env.ARTIFACT_PATH }}

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    env:
      AWS_S3_BUCKET: theminesweeper.com
      AWS_REGION: us-east-2
      AWS_ROLE: arn:aws:iam::067429979131:role/github_actions_minesweeper
      CLOUDFRONT_DISTRIBUTION_ID: E32QGZLPPEMLDF
    environment:
      name: production
      url: "https://${{ env.AWS_S3_BUCKET }}"
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT_NAME }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: |
          set -euo pipefail

          # Each rule: <include-glob>|<content-type>|<cache-control>
          rules=(
            "index.html|text/html; charset=utf-8|no-cache"
            "config.json|application/json; charset=utf-8|no-cache"
            "*.js|application/javascript; charset=utf-8|public, max-age=3600"
            "*.css|text/css; charset=utf-8|public, max-age=3600"
            "*.svg|image/svg+xml; charset=utf-8|public, max-age=3600"
            "*.png|image/png; charset=utf-8|public, max-age=3600"
            "*.webmanifest|application/manifest+json; charset=utf-8|public, max-age=3600"
            "*.txt|text/plain; charset=utf-8|public, max-age=3600"
            "*.xml|application/xml; charset=utf-8|public, max-age=3600"
            "LICENSE|text/plain; charset=utf-8|public, max-age=3600"
          )

          for rule in "${rules[@]}"; do
            IFS="|" read -r glob ctype cache <<< "$rule"
            echo "Uploading $glob"
            aws s3 sync . "s3://$AWS_S3_BUCKET" \
              --delete \
              --exclude "*" \
              --include "$glob" \
              --content-type "$ctype" \
              --cache-control "$cache"
          done

          # sw.js is uploaded by the *.js rule above; the service worker must always
          # revalidate, so force its Cache-Control afterwards.
          aws s3 cp "s3://$AWS_S3_BUCKET/sw.js" "s3://$AWS_S3_BUCKET/sw.js" \
            --metadata-directive REPLACE \
            --content-type "application/javascript; charset=utf-8" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"

  create-release:
    name: Create release
    needs: deploy               # tag and publish only what actually reached production
    runs-on: ubuntu-24.04
    permissions:
      contents: write           # needed to push the tag
    env:
      ARTIFACT_PATH: artifact
      ASSET_NAME: minesweeper.zip
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0        # the version is derived from the tag list

      - name: Set up Git and GPG
        run: |
          set -euo pipefail

          git config --local user.email "r.stoyanov@outlook.com"
          git config --local user.name "Radoslav Stoyanov"

          echo -n "${{ secrets.GPG_PRIVATE_KEY }}" | base64 --decode | gpg --import
          gpg -k

          git config --local tag.gpgsign true
          git config --local user.signingkey "${{ secrets.GPG_KEY_ID }}"

      - name: Get current version
        id: current_version
        run: |
          # No pipefail here: grep exits 1 when there are no tags yet, which is fine.
          latest_tag=$(git tag | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          latest_tag="${latest_tag:-v0.0.0}"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "Found latest tag: $latest_tag"

      - name: Calculate new version
        id: new_version
        env:
          LATEST_TAG: ${{ steps.current_version.outputs.latest_tag }}
          VERSION_TYPE: ${{ inputs.version_type }}
        run: |
          set -euo pipefail

          IFS='.' read -r major minor patch <<< "${LATEST_TAG#v}"

          case "$VERSION_TYPE" in
            major)
              major=$((major + 1)); minor=0; patch=0
              ;;
            minor)
              minor=$((minor + 1)); patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac

          new_version="v${major}.${minor}.${patch}"
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"
          echo "Calculated new version: $new_version"

      - name: Print release info
        run: |
          {
            echo "## Release information"
            echo ""
            echo "- **Previous version**: ${{ steps.current_version.outputs.latest_tag }}"
            echo "- **New version**: ${{ steps.new_version.outputs.new_version }} (${{ inputs.version_type }})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create and push signed tag
        env:
          NEW_VERSION: ${{ steps.new_version.outputs.new_version }}
        run: |
          set -euo pipefail

          git tag -s "$NEW_VERSION" -m "Release $NEW_VERSION"
          git push origin "$NEW_VERSION"

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ./${{ env.ARTIFACT_PATH }}

      - name: Prepare release asset
        run: zip -r "$ASSET_NAME" "$ARTIFACT_PATH"

      - name: Create GitHub release
        env:
          # A PAT, not GITHUB_TOKEN: releases created with GITHUB_TOKEN don't emit a
          # `release: published` event, which would leave commentReleasedPRs.yml dead.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NEW_VERSION: ${{ steps.new_version.outputs.new_version }}
        run: |
          gh release create "$NEW_VERSION" "$ASSET_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$NEW_VERSION" \
            --generate-notes
